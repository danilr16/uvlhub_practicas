name: Deploy to Render

on:
    push:
      tags:
        - 'v*'

jobs:
  run-tests:
    uses: ./.github/workflows/CI_pytest.yml

  deploy:
    name: Deploy to Render
    needs: run-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"
